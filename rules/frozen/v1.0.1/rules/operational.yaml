rules:
- rule_id: r_ops_no_monitoring_path
  rule_type: method
  source:
    source_type: DATA_SCOPE_DECISION
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-1
    physical_pdf_pages:
    - 1
  scope:
    experiment: 2022重算
  conditions:
    verified_monitoring_data: false
  action:
    type: select_method
    selected: 排放因子法和燃煤物料衡算法
    base102: 基102产生量、排放量只作结果对比，不参与方法选择、效率反推或最终计算
  on_missing: withhold
- rule_id: r_ops_e7_gas_unit
  rule_type: formula
  source:
    source_type: EXTERNAL_UNIT_INTERPRETATION
    document: 固定燃烧源清单实验实施协议v4
    section: D.1注c、广东指南表3注c、生态环境部公告2021年第24号
    physical_pdf_pages:
    - 1
  scope:
    fuels:
    - 焦炉煤气
    - 高炉煤气
    - 其它煤气
    - 天然气
    - 转炉煤气
    - 其它气体燃料
  conditions:
    activity_unit: m3
  action:
    type: assign_formula
    factor_unit: g/m3
  on_missing: withhold
- rule_id: r_ops_excel_formula_chain
  rule_type: formula
  source:
    source_type: IMPLEMENTATION_REQUIREMENT
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-2
    physical_pdf_pages:
    - 1
  scope:
    workbook: Excel
  conditions:
    formula_fields:
    - 活动水平
    - 因子匹配
    - 产生量
  action:
    type: assign_formula
    implementation: Excel公式
  on_missing: withhold
- rule_id: r_ops_operation_rate_one
  rule_type: control
  source:
    source_type: EMPIRICAL_ASSUMPTION
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-10
    physical_pdf_pages:
    - 1
  scope:
    operation_time_available: false
  conditions:
    设施投运率: =1
    interpretation: 经验
  action:
    type: assign_control
    operation_rate: 1
    note: 经验缺省效率，不代表设施真实去除效率
  on_missing: withhold
- rule_id: r_ops_control_missing_zero
  rule_type: control
  source:
    source_type: EMPIRICAL_MISSING_DATA_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-4
    physical_pdf_pages:
    - 1
  scope:
    control_field: blank
  conditions:
    applicable_efficiency: 0
  action:
    type: assign_control
    label: 治理信息缺失按0
  on_missing: withhold
- rule_id: r_ops_control_unmapped_zero
  rule_type: control
  source:
    source_type: EMPIRICAL_MISSING_DATA_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-4
    physical_pdf_pages:
    - 1
  scope:
    control_field: nonblank_unmapped
  conditions:
    applicable_efficiency: 0
  action:
    type: assign_control
    label: 治理工艺无法映射按0
  on_missing: withhold
- rule_id: r_ops_standard_combination
  rule_type: control
  source:
    source_type: T_CSES_OPERATIONALIZATION
    document: T/CSES 144—2024
    section: A.1、实施协议v4-6
    physical_pdf_pages:
    - 33
    - 34
    - 35
  scope:
    explicit_combinations:
    - 低氮燃烧技术+选择性非催化还原法
    - 低氮燃烧技术+选择性催化还原法
  conditions:
    priority: combination_row
  action:
    type: assign_control
    label: 标准组合工艺缺省效率
  on_missing: withhold
- rule_id: r_ops_multi_process_max
  rule_type: control
  source:
    source_type: EMPIRICAL_COMBINATION_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-6
    physical_pdf_pages:
    - 1
  scope:
    multiple_applicable_processes: true
    standard_combination_available: false
  conditions:
    aggregation: max_not_sum
  action:
    type: assign_control
    label: 多工艺取最大缺省效率
  on_missing: withhold
- rule_id: r_ops_cobenefit_all_fields
  rule_type: control
  source:
    source_type: T_CSES_OPERATIONALIZATION
    document: T/CSES 144—2024
    section: A.1、实施协议v4-6
    physical_pdf_pages:
    - 33
    - 34
    - 35
  scope:
    for_each_pollutant_check_fields:
    - 脱硫
    - 脱硝
    - 除尘
    effect: 协同去除
  conditions:
    candidate_efficiencies: all mapped A.1 cells
  action:
    type: assign_control
    label: 协同去除缺省效率
  on_missing: withhold
- rule_id: r_ops_co_vocs_zero
  rule_type: control
  source:
    source_type: T_CSES_OPERATIONALIZATION
    document: T/CSES 144—2024
    section: A.1、实施协议v4-8
    physical_pdf_pages:
    - 33
    - 34
    - 35
  scope:
    pollutants:
    - CO
    - VOCs
    explicit_applicable_control: false
  conditions:
    efficiency: 0
  action:
    type: assign_control
    label: 无适用治理措施按0
  on_missing: withhold
- rule_id: r_ops_nh3_no_scr_zero
  rule_type: control
  source:
    source_type: EXPERIMENT_DISPOSITION_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-9
    physical_pdf_pages:
    - 1
  scope:
    explicit: 明确没有SCR/SNCR
    pollutant: NH3
  conditions:
    result: 0
  action:
    type: assign_control
    label: 无适用治理措施按0
  on_missing: withhold
- rule_id: r_ops_nh3_denox_missing_zero
  rule_type: control
  source:
    source_type: EMPIRICAL_MISSING_DATA_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-9
    physical_pdf_pages:
    - 1
  scope:
    denox_information: blank
    pollutant: NH3
  conditions:
    result: 0
  action:
    type: assign_control
    label: 脱硝信息缺失按0
  on_missing: withhold
- rule_id: r_ops_nh3_coal_missing
  rule_type: control
  source:
    source_type: CALCULATION_SAFETY_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-9
    physical_pdf_pages:
    - 1
  scope:
    SCR/SNCR: true
    applicable_coal_activity: false
  conditions:
    result: 留空
    destination: 异常清单
  action:
    type: assign_control
    label: 信息不足
    note: SCR/SNCR存在但煤耗缺失时NH3留空并进入异常清单
  on_missing: withhold
- rule_id: r_ops_foundational_missing
  rule_type: quality_control
  source:
    source_type: CALCULATION_SAFETY_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-11
    physical_pdf_pages:
    - 1
  scope:
    required_parameters:
    - 燃料量
    - 燃料类型
    - 硫分
    - 灰分
    - 容量
    - 产生因子
  conditions:
    when_missing: 留空
    destination: 最终异常清单
  action:
    type: check_quality
    admission: withhold
  on_missing: withhold
- rule_id: r_ops_no_reported_inverse
  rule_type: quality_control
  source:
    source_type: EXPERIMENT_PROHIBITION
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-3
    physical_pdf_pages:
    - 1
  scope:
    prohibited: 1-环统排放量/环统产生量
  conditions:
    enforcement: 禁止环统反推治理效率
  action:
    type: check_quality
    required_absence: true
  on_missing: withhold
- rule_id: r_ops_no_arbitrary_vocs
  rule_type: quality_control
  source:
    source_type: EXPERIMENT_PROHIBITION
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-3、v4-8
    physical_pdf_pages:
    - 1
  scope:
    pollutant: VOCs
    prohibited:
    - 除以5
    - 除以2
  conditions:
    enforcement: 禁止
  action:
    type: check_quality
    required_absence: true
  on_missing: withhold
- rule_id: r_ops_reported_comparison_only
  rule_type: quality_control
  source:
    source_type: DATA_SCOPE_DECISION
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-1
    physical_pdf_pages:
    - 1
  scope:
    source: 基102
    role: 只作结果对比
  conditions:
    calculation_participation: 不参与
  action:
    type: check_quality
    separate_columns: true
  on_missing: withhold
- rule_id: r_ops_source_aggregation_gate
  rule_type: quality_control
  source:
    source_type: CALCULATION_SAFETY_RULE
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-11
    physical_pdf_pages:
    - 1
  scope:
    any_required_fuel_item_missing: true
  conditions:
    source_pollutant_total: 不得输出部分汇总
  action:
    type: check_quality
    admission: withhold
  on_missing: withhold
- rule_id: r_ops_disposition_labels
  rule_type: quality_control
  source:
    source_type: OUTPUT_REQUIREMENT
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-12
    physical_pdf_pages:
    - 1
  scope:
    per_source_pollutant: true
  conditions:
    labels: &id001
    - 工艺缺省效率
    - 标准组合工艺缺省效率
    - 低氮燃烧缺省效率
    - 协同去除缺省效率
    - 多工艺取最大缺省效率
    - 治理信息缺失按0
    - 治理工艺无法映射按0
    - 无适用治理措施按0
    - SCR/SNCR氨逃逸核算
  action:
    type: check_quality
    required_labels: *id001
  on_missing: withhold
- rule_id: r_ops_exception_list
  rule_type: quality_control
  source:
    source_type: OUTPUT_REQUIREMENT
    document: 固定燃烧源清单实验实施协议v4
    section: 实施协议v4-11
    physical_pdf_pages:
    - 1
  scope:
    unreliable_or_notice_items: true
  conditions:
    destination: 最终异常清单
  action:
    type: check_quality
    output: exception_ledger
  on_missing: withhold
- rule_id: r_ops_industrial_coal_department_canonicalization
  rule_type: parameter_mapping
  source:
    source_type: ANOMALY_AUDIT_CORRECTION
    document: 固定燃烧源清单实验实施协议v4
    section: 异常审计2026-08
    physical_pdf_pages:
    - 1
  scope:
    sector: 工业源
    parameter_table: 附录C
  conditions:
    canonical_department: 采矿业和制造业
  action:
    type: normalize_parameter_key
    field: department
  on_missing: withhold
- rule_id: r_ops_no_technology_factor_fallback
  rule_type: parameter_mapping
  source:
    source_type: ANOMALY_AUDIT_CORRECTION
    document: 固定燃烧源清单实验实施协议v4
    section: 异常审计2026-08
    physical_pdf_pages:
    - 1
  scope:
    exact_technology_match: false
    fallback_technology: 不分技术
  conditions:
    candidate_count: 1
  action:
    type: controlled_parameter_fallback
    ambiguous_candidates: withhold
  on_missing: withhold
- rule_id: r_ops_anomaly_audit_taxonomy
  rule_type: quality_control
  source:
    source_type: ANOMALY_AUDIT_CORRECTION
    document: 固定燃烧源清单实验实施协议v4
    section: 异常审计2026-08
    physical_pdf_pages:
    - 1
  scope:
    audited_source_exceptions: true
  conditions:
    reason_codes:
    - NH3_FACTOR_SCOPE_MISMATCH
    - FUEL_OUTSIDE_FIXED_FOSSIL_SCOPE
    - OTHER_FUEL_TCE_UNRESOLVED
    - COMBUSTION_TECHNOLOGY_AMBIGUOUS
    - T_CSES_COAL_BC_OC_PARAMETER_GAP
    - FACTOR_APPLICABILITY_UNRESOLVED
    - T_CSES_COAL_PARAMETER_GAP
  action:
    type: assign_exception_taxonomy
    source_level_reporting: true
  on_missing: withhold
