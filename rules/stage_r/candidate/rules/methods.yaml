# 固定燃烧源候选规则包 — 核算方法规则 (rules/methods.yaml)
# 依据：T/CSES 144-2024 第6.3节、第7.2节、第7.3节、第7.4节、第8.3节
rules:
  - rule_id: r_method_monitoring_vs_coefficient_power_heat
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第7.2.1节 SO2、NOx和VOCs排放量核算方法
      physical_pdf_pages: [9]
    scope:
      source_sector: 电力热力源
      pollutants: [SO2, NOx, VOCs]
    conditions:
      qualified_monitoring_data:
        available: 在线监测法（公式1）
        unavailable: 产排污系数法（公式2）
    action:
      type: select_method
      priority: [online_monitoring, production_emission_coefficient]
    on_missing: withhold

  - rule_id: r_method_pm_power_heat
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第7.2.2节 PM2.5、PM10、BC、OC和CO排放量核算方法
      physical_pdf_pages: [10]
    scope:
      source_sector: 电力热力源
      pollutants: [PM2.5, PM10, BC, OC, CO]
    conditions:
      monitoring_data_requirements:
        met: 公式（1）适用于PM2.5、PM10
        not_met: 产排污系数法公式（2）
    action:
      type: select_method
      fallback_formula: r_formula_coefficient_method
    on_missing: withhold

  - rule_id: r_method_industrial_boiler
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第8.3.1节 排放量核算方法
      physical_pdf_pages: [14]
    scope:
      selected_scope: industrial_fossil_fixed_combustion
    conditions:
      method_options: [在线监测法, 产排污系数法]
      activity_level_type: 燃料消耗量
      ef_reference: 附录E 表E.7
    action:
      type: select_method
      formula: [r_formula_online_monitoring, r_formula_coefficient_method]
      activity_level: 燃料消耗量
      ef_source: 附录E 表E.7
    on_missing: withhold

  - rule_id: r_method_ef_acquisition
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第6.3.1节 f)、第7.2.1.2节
      physical_pdf_pages: [8, 9]
    scope:
      parameter: 污染物产生系数EF
    conditions:
      acquisition_priority: [实测法, 物料衡算法, 产排污系数库取值法]
      library_selection_factors: [行业, 产品或原料类型, 工艺技术]
      default_reference: 附录D 表D.1
      alternative_reference: 生态环境部公告2021年第24号
    action:
      type: select_method
      priority: [field_measurement, mass_balance, coefficient_library]
      library_ef_source: 附录D 表D.1
    on_missing: withhold

  - rule_id: r_method_coal_mass_balance
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第7.2.1.2节、第7.2.2节、第8.3.1节
      physical_pdf_pages: [9, 10, 14]
    scope:
      fuel: 燃煤
      pollutants: [SO2, PM2.5, PM10, BC, OC]
    conditions:
      balance_formulas:
        SO2: 公式（3）
        PM: 公式（4）
        BC: 公式（5）
        OC: 公式（6）
      coal_property_source: 附录C 表C.1、表C.2、表C.3
    action:
      type: select_method
      method: coal_mass_balance
      formulas: [r_formula_so2_balance, r_formula_pm_balance, r_formula_bc, r_formula_oc]
    on_missing: withhold

  - rule_id: r_method_eta_actual
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第7.2.1.2节
      physical_pdf_pages: [9]
    scope:
      parameter: 污染控制技术实际去除效率η
    conditions:
      formula: 平均去除效率 × 设施投运率
      operation_rate: 治理设施运行时间（小时/年）÷ 正常生产时间（小时/年）
      average_efficiency_source: 附录A 表A.1
    action:
      type: select_method
      method: eta_actual = eta_average * operation_rate
    on_missing: withhold

  - rule_id: r_method_dynamic
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第7.3节、第7.3.1节、第7.3.2节、第7.3.3节、第8.3.2节
      physical_pdf_pages: [10, 11, 15]
    scope:
      source: [电力热力源, 工业源化石燃料固定燃烧]
    conditions:
      priority: [连续监测数据法, 日活动水平数据法, 其他动态化方法, 逐月+附录B表B.1]
      cems_valid_hours_min: 18
      activity_parameter:
        power_heat: [日发电量, 供热量, 能耗量]
        industrial_boiler: 燃料消耗量
    action:
      type: select_method
      formulas: [r_formula_daily_cems, r_formula_daily_flux_profile, r_formula_daily_profile_alloc, r_formula_daily_activity_alloc]
    on_missing: withhold

  - rule_id: r_method_spatial
    rule_type: method
    source:
      document: T/CSES 144—2024
      section: 第7.4节、第8.3.3节
      physical_pdf_pages: [11, 15]
    scope:
      source: [电力热力源, 工业源化石燃料固定燃烧]
    conditions:
      spatial_scale: 点源
      method: 按排污设施经纬度直接定位到排放网格
    action:
      type: select_method
      method: point_source_grid_location
    on_missing: report_issue
