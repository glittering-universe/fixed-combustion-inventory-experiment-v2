# 固定燃烧源候选规则包 — 计算公式规则 (rules/formulas.yaml)
# 依据：T/CSES 144-2024 第7.2节、第7.3节、附录D 表D.1注b
rules:
  - rule_id: r_formula_online_monitoring
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（1）
      physical_pdf_pages: [9]
    scope:
      method: 在线监测法
    conditions:
      symbols:
        E: 污染物排放量（吨）
        k: 烟道监测第k个断面
        C: 污染物小时平均排放浓度（毫克/立方米）
        Q: 小时平均烟气排放量（立方米/小时）
        T: 总生产小时数（小时）
    action:
      type: assign_formula
      formula: E = sum_k(C_k * Q_k * T_k * 1e-6)
    on_missing: withhold

  - rule_id: r_formula_coefficient_method
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（2）
      physical_pdf_pages: [9]
    scope:
      method: 产排污系数法
    conditions:
      symbols:
        E: 污染物排放量（吨）
        A: 第四级排放源对应用于发电和供热的燃料消耗量
        EF: 污染物的产生系数
        eta: 污染控制技术对污染物的实际去除效率
      ef_sources: [实测法, 物料衡算法, 产排污系数库取值法（附录D 表D.1）]
    action:
      type: assign_formula
      formula: E = A * EF * (1 - eta)
    on_missing: withhold

  - rule_id: r_formula_so2_balance
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（3）
      physical_pdf_pages: [10]
    scope:
      fuel: 燃煤锅炉
      pollutant: SO2
    conditions:
      symbols:
        EF_SO2: 燃煤锅炉SO2产生系数
        S: 平均燃煤收到基硫分（%，分批次入炉煤质数据加权）
        sr: 硫分进入底灰比例（附录C 表C.1）
      required_inputs: [S, sr]
    action:
      type: assign_formula
      formula: EF_SO2 = 2 * S * (1 - sr)
    on_missing: withhold

  - rule_id: r_formula_pm_balance
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（4）
      physical_pdf_pages: [10]
    scope:
      fuel: 燃煤锅炉
      pollutant: [PM2.5, PM10]
    conditions:
      symbols:
        EF_PM: 某粒径范围颗粒物产生系数
        Aar: 平均燃煤收到基灰分（%，分批次入炉煤质数据加权）
        ar: 灰分进入底灰比例（附录C 表C.1）
        fPM: 颗粒物粒径分布系数（附录C 表C.2）
      required_inputs: [Aar, ar, fPM]
    action:
      type: assign_formula
      formula: EF_PM = Aar * (1 - ar) * fPM
    on_missing: withhold

  - rule_id: r_formula_bc
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（5）
      physical_pdf_pages: [10]
    scope:
      fuel: 燃煤锅炉
      pollutant: BC
    conditions:
      symbols:
        EF_BC: BC产生系数
        EF_PM2.5: PM2.5产生系数（公式4）
        fBC: BC占PM2.5比例（附录C 表C.3）
      required_inputs: [EF_PM2.5, fBC]
    action:
      type: assign_formula
      formula: EF_BC = EF_PM2.5 * fBC
    on_missing: withhold

  - rule_id: r_formula_oc
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（6）
      physical_pdf_pages: [10]
    scope:
      fuel: 燃煤锅炉
      pollutant: OC
    conditions:
      symbols:
        EF_OC: OC产生系数
        EF_PM2.5: PM2.5产生系数（公式4）
        fOC: OC占PM2.5比例（附录C 表C.3）
      required_inputs: [EF_PM2.5, fOC]
    action:
      type: assign_formula
      formula: EF_OC = EF_PM2.5 * fOC
    on_missing: withhold

  - rule_id: r_formula_daily_cems
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（7）
      physical_pdf_pages: [10]
    scope:
      method: 连续监测数据法（日排放量）
    conditions:
      symbols:
        Ed: 污染物日排放量（吨）
        n: 通过有效性审核数据的小时数（小时）
        Ci: 第i小时污染物浓度小时均值（毫克/立方米）
        Qi: 第i小时烟气量小时均值（立方米/小时）
      validity_constraint: n >= 18
    action:
      type: assign_formula
      formula: Ed = (24 / n) * sum_i(C_i * Q_i * 1e-6)
    on_missing: withhold

  - rule_id: r_formula_daily_flux_profile
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（8）
      physical_pdf_pages: [10]
    scope:
      method: 连续监测数据法（烟气量日变化时间廓线）
    conditions:
      symbols:
        Qd: 企业日烟气量（立方米）
        Qi: 第i小时烟气量小时均值（立方米/小时）
        n: 通过有效性审核数据的小时数（小时）
      validity_constraint: n >= 18
    action:
      type: assign_formula
      formula: Qd = (24 / n) * sum_i(Q_i)
    on_missing: withhold

  - rule_id: r_formula_daily_profile_alloc
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（9）
      physical_pdf_pages: [10]
    scope:
      method: 连续监测数据法（年排放量按烟气量廓线分配到日）
    conditions:
      symbols:
        Ed: 污染物日排放量（吨）
        E: 污染物年排放量（吨）
        Qd: 企业日烟气量（立方米）
      denominator_days: [365, 366]
    action:
      type: assign_formula
      formula: Ed = E * Qd / sum_d(Q_d)  (d = 1..365 或 366)
    on_missing: withhold

  - rule_id: r_formula_daily_activity_alloc
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 公式（10）
      physical_pdf_pages: [10, 11]
    scope:
      method: 日活动水平数据法（年排放量按日活动水平分配到日）
    conditions:
      symbols:
        Ed: 污染物日排放量（吨）
        E: 污染物年排放量（吨）
        Ad: 企业日发电量、供热量或能耗量数据（工业源化石燃料固定燃烧为燃料消耗量）
      denominator_days: [365, 366]
    action:
      type: assign_formula
      formula: Ed = E * Ad / sum_d(A_d)  (d = 1..365 或 366)
    on_missing: withhold

  - rule_id: r_formula_nox_capacity_lookup
    rule_type: formula
    source:
      document: T/CSES 144—2024
      section: 附录D 表D.1 注b
      physical_pdf_pages: [45]
    scope:
      department: 电力生产
      pollutant: NOx
      fuel: [煤炭, 煤矸石]
    conditions:
      capacity_lookup:
        "<=100MW": 8.96
        "(100,300MW)": 8.19
        ">=300MW": 7.21
      unit: g/kg燃料
    action:
      type: assign_formula
      formula: EF_NOx = lookup(capacity_mw)
    on_missing: withhold
